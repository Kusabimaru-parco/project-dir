<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <link rel="stylesheet" href="../static/css/style_register.css">
</head>
<body background="https://manybackgrounds.com/images/hd/giant-stars-4k-space-q03wbnsie2ul47hh.jpg " style="background-size: cover;">

  <div class="register-container">
    <h2>Sign Up</h2>
    <form action="#" method="post">
      <input type="text" name="fullname" placeholder="Full Name" required>
      <input type="text" name="username" placeholder="Username" required>
      <input type="email" name="email" placeholder="Email" required>
      <input type="password" name="password" placeholder="Password" required>
      <input type="password" name="confirm_password" placeholder="Confirm Password" required>
      <button type="submit">Create Account</button>
    </form>
    <p>Already have an account? <a href="../templates/index.html">Log in</a></p>
  </div>

</body>
</html>
